name: Build iOS App

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: macos-14 # Используем официальный сервер Apple от GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Скачиваем все зависимости видеоканала

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Или актуальная версия для проекта

      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build IPA using Gomobile
        run: |
          cd mobile
          # gomobile сама соберет графическую обертку вокруг Go-кода
          gomobile build -target=ios -bundleid org.openlibre.olcrtc -o OlcRTC.ipa

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: OlcRTC-iOS-App
          path: mobile/OlcRTC.ipa
